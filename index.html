<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Picker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Color Picker App</h1>
      <input type="color" name="color" id="color-picker" value="#D20103" />
    </header>
    <main class="content">
      <h2 id="heading">This is a dynamic heading</h2>
      <p id="paragraph">
        You can change the text Color of this Paragraph and Heading using thee
        color picker above
      </p>
    </main>
  </body>
  <script src="script.js"></script>
</html>
